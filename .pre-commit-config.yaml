# Pre-commit hooks — h2odolanow-landing.
# Wersje narzędzi są przypięte tutaj, więc każdy clone odtwarza pełny gate jakości:
#   pre-commit run --all-files
# albo bez instalacji:
#   uvx pre-commit run --all-files

repos:
  # Python (narzędzia jakości dokumentacji)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^(tools|tests)/

  # Bezpieczeństwo: skaner sekretów
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Higiena repozytorium
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=800]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Polityka Fayna: brak podpisu AI (w treści repozytorium i w komunikacie commita)
  - repo: local
    hooks:
      - id: no-ai-signature
        name: no AI co-author signature
        entry: bash -c '! grep -rInEi "co-[a-z]+-by|noreply@anthropic|generated with[^\n]*(claude|anthropic|gpt|copilot)" --exclude-dir=.git --exclude-dir=node_modules . && ! grep -qiE "co-[a-z]+-by|noreply@anthropic" "$1"'
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: false

      - id: node-syntax
        name: node --check (JavaScript)
        entry: node --check
        language: system
        files: \.(js|mjs)$

      - id: node-tests
        name: node --test (testy API i panelu)
        entry: npm test
        language: system
        files: ^(server|tests)/.*\.(mjs|js)$
        pass_filenames: false

      - id: docs-links
        name: linki w dokumentacji
        entry: python3 tools/check_docs_links.py
        language: system
        files: \.md$
        pass_filenames: false
